on:
  release:
    types: [published]

name: Release
jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # check if tagged version matches federation-sdk version
      - name: Check version
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          SDK_VERSION=$(jq -r '.version' packages/federation-sdk/package.json)
          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match federation-sdk version ($SDK_VERSION)"
            exit 1
          fi

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - run: bun run lint

      - run: bun run test

      - run: bun run bundle:sdk

      - name: Publish to NPM
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}
        run: |
          cd ./federation-bundle
          VERSION=$(jq -r '.version' package.json)
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease (e.g. 0.7.0-beta.0): publish under its prerelease dist-tag,
            # never "latest". Tag = identifier before the first dot (beta, rc, alpha...).
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
            echo "Publishing prerelease $VERSION with dist-tag: $TAG"
            bun publish --access public --tag "$TAG"
          else
            echo "Publishing release $VERSION with dist-tag: latest"
            bun publish --access public
          fi
